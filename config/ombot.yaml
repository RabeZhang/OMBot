app:
  name: OMBot
  env: development
  host_id: local-dev

agent:
  max_context_messages: 30
  auto_summary_threshold: 24
  system_prompt_template: "config/prompts/system.txt"
  workspace_files:
    - "workspace/RUNBOOK.md"
    - "workspace/HOST_PROFILE.md"
    - "workspace/TOOLS.md"

gateway:
  mode: embedded
  local_cli_enabled: true
  approval_timeout_sec: 300

logging:
  level: info
  pretty: true

# 命令执行环境配置
execution:
  # mode: host | docker
  # host - 在 OMBot 进程所在环境执行（默认）
  # docker - 在指定容器中执行（需预先创建）
  mode: host
  # docker 模式配置（mode: docker 时生效）
  # docker_container: "ombot-sandbox"
  # docker_options:
  #   workdir: "/workspace"

events:
  enabled: true
  dir: "./workspace/events"
  default_timezone: "Asia/Shanghai"
  max_queued_per_session: 5
  startup_scan: true

host_profile:
  auto_refresh_on_start: true
  json_path: "./data/host/environment.json"
  workspace_profile_path: "./workspace/HOST_PROFILE.md"

code_execution:
  enabled: true
  timeout_sec: 20
  network_enabled: false
  workdir_root: "./data/code-sandbox"
  python_bin: "python3"
  ts_runner: "tsx"
  cpu_time_sec: 10
  max_memory_mb: 512
  max_file_kb: 10240
  max_processes: 32
  max_open_files: 64

paths:
  data_dir: "./data"
  workspace_dir: "./workspace"
  transcripts_dir: "./data/sessions"
  audit_db_path: "./data/audit/audit.db"
